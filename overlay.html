<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>POINT FIX IT Live Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
</style>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

<script>
(function(g){
var COLS=['rank','flag','logo','team','el','mp','wwcd','pp','kp','tp'];
var LB={rank:'#',flag:'',logo:'',team:'TEAM',el:'ELIMS',mp:'MP',wwcd:'WWCD',pp:'PP',kp:'KP',tp:'PTS'};

var CSS='.pso{position:relative;overflow:hidden;font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.95);line-height:1}'
+'.pso .r{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;box-sizing:border-box;padding:0 .4em 0 .3em;background:rgba(8,8,12,.66);border-left:.18em solid var(--ac);will-change:transform;transition:transform .8s cubic-bezier(.22,.8,.22,1),opacity .5s}'
+'.pso.n .r{transition:none}'
+'.pso .r.eliminated{background:linear-gradient(90deg,rgba(115,10,18,.94),rgba(42,7,12,.88));border-left-color:#ff2735}'
+'.pso .r.h{background:var(--ac);font-weight:700;font-size:.55em;color:var(--hc)}'
+'.pso .c{flex:none;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}'
+'.pso .c.rank{width:calc(var(--f)*1.6)}'
+'.pso .c.mp,.pso .c.wwcd,.pso .c.pp,.pso .c.kp{width:calc(var(--f)*2)}'
+'.pso .c.tp{width:calc(var(--f)*2.3);font-size:1.12em}'
+'.pso .c.team{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;padding:0 .3em}'
+'.pso .c.rank.m1{background:#f5c542;color:#111}'
+'.pso .c.rank.m2{background:#cfd6df;color:#111}'
+'.pso .c.rank.m3{background:#cd7f32;color:#111}'
+'.pso .c.el{width:calc(var(--f)*1.8)}'
+'.pso .c.flag,.pso .c.logo{display:flex;align-items:center;justify-content:center;padding:0 .12em}'
+'.pso .c.flag{width:calc(var(--f)*1.9)}.pso .c.logo{width:calc(var(--f)*1.6)}'
+'.pso .c.flag img{width:1.55em;height:1.05em;object-fit:cover}'
+'.pso .c.logo img{width:1.35em;height:1.35em;object-fit:contain}'
+'.pso .r.h .c.flag,.pso .r.h .c.logo{display:none}'
+'.pso.d2 .r{background:rgba(244,248,246,.95);color:#10261b;text-shadow:none;border-left:0;border-bottom:1px solid rgba(0,0,0,.08)}'
+'.pso.d2 .r.h{background:var(--ac);color:var(--hc)}'
+'.pso.d2 .c.tp{color:#10261b}'
+'.pso.d3 .r{background:linear-gradient(90deg,rgba(14,26,78,.96),rgba(8,14,46,.92));border-left:.22em solid var(--ac)}'
+'.pso.d4 .r{background:linear-gradient(90deg,rgba(10,10,12,.97),rgba(30,8,10,.94));border-left:.3em solid var(--ac)}'
+'.pso.d5 .r{background:rgba(26,8,56,.9);border-left:0;border-radius:.45em;box-shadow:0 0 .7em var(--ac)}';

function compute(d,view){
var kp=+d.kp||0,pts=d.pts||[],M=d.matches||[];
var pl=function(p){var n=parseInt(p,10);return n>0?(+pts[n-1]||0):0;};
var out=(d.teams||[]).map(function(n,i){
var m=0,w=0,pp=0,k=0;
if(view==null||view==='o'){
M.forEach(function(x){
var r=x&&x[i];
if(!r||(!r.p&&!r.k))return;
m++;
if(parseInt(r.p,10)===1)w++;
k+=parseFloat(r.k)||0;
pp+=pl(r.p);
});
}else{
var r=(M[+view]||{})[i]||{};
m=1;w=parseInt(r.p,10)===1?1:0;
k=parseFloat(r.k)||0;pp=pl(r.p);
}
return{id:i,n:String(n),mp:m,wwcd:w,pp:pp,kills:k,kp:k*kp,tp:pp+k*kp};
});
out.sort(function(a,b){return b.tp-a.tp||b.wwcd-a.wwcd||b.kills-a.kills||a.id-b.id;});
return out;
}

function mount(el,o){
if(!document.getElementById('pso-css')){
var s=document.createElement('style');
s.id='pso-css';s.textContent=CSS;document.head.appendChild(s);
}
var S={o:Object.assign({w:380,h:1080,fs:20,rs:6,ac:'#e10600',cols:COLS.slice(),n:25},o||{}),rows:{},prev:{},data:null,view:'o',first:true,moved:[]};
el.classList.add('pso','n');

function hc(a){
var h=String(a).replace('#','');
return(.299*parseInt(h.substr(0,2),16)+.587*parseInt(h.substr(2,2),16)+.114*parseInt(h.substr(4,2),16))>150?'#111':'#fff';
}
function vis(){return COLS.filter(function(c){return S.o.cols.indexOf(c)>-1;});}
function cells(row,h){
var c={};
vis().forEach(function(k){
var e=document.createElement('span');
e.className='c '+k;
if(h)e.textContent=LB[k];
row.appendChild(e);c[k]=e;
});
return c;
}
function rebuild(){
var q=S.o;el.textContent='';S.rows={};S.prev={};S.first=true;
el.className=(el.className.replace(/\s*\bd\d\b/g,'')+' d'+(q.dz||1)).trim();
el.classList.add('n');
el.style.width=q.w+'px';el.style.height=q.h+'px';
el.style.fontSize=q.fs+'px';
el.style.setProperty('--ac',q.ac);
el.style.setProperty('--f',q.fs+'px');
el.style.setProperty('--hc',hc(q.ac));
var h=document.createElement('div');
h.className='r h';h.style.height=q.fs*1.4+'px';
cells(h,true);el.appendChild(h);
}
function flash(e,up){
try{
e.animate([
{boxShadow:'inset 0 0 0 999px '+(up?'rgba(70,255,140,.5)':'rgba(255,90,90,.45)')},
{boxShadow:'inset 0 0 0 999px rgba(0,0,0,0)'}
],{duration:1500,easing:'ease-out'});
}catch(x){}
}
function img(r,k,src){
var c=r.cells[k];
if(!c||r.v['i'+k]===src)return;
r.v['i'+k]=src;c.textContent='';
if(src){
var m=new Image();m.alt='';m.src=src;c.appendChild(m);c.style.display='';
}else c.style.display='none';
}
function put(r,k,v){
if(r.cells[k]&&r.v[k]!==v){
r.v[k]=v;r.cells[k].textContent=v;
}
}
function update(data,view){
S.data=data;S.view=view==null?'o':String(view);S.moved=[];
var q=S.o,hh=q.fs*1.4,list=compute(data,S.view);
var N0=Math.max(1,Math.min(q.n,25,list.length));
var rh=Math.max(q.fs*1.25,Math.min(q.fs*1.9,(q.h-hh-(N0-1)*q.rs)/N0));
var fit=Math.max(0,Math.floor((q.h-hh+q.rs)/(rh+q.rs)));
var N=Math.min(N0,fit),seen={};

list.forEach(function(t,rank){
seen[t.id]=1;var r=S.rows[t.id];
if(!r){
var e=document.createElement('div');
e.className='r';
r={el:e,cells:cells(e,false),v:{},tf:'',op:'',h:''};
S.rows[t.id]=r;el.appendChild(e);
}
if(r.h!==rh){r.h=rh;r.el.style.height=rh+'px';}
put(r,'rank',rank+1);put(r,'team',t.n);
put(r,'mp',t.mp);put(r,'wwcd',t.wwcd);
put(r,'pp',t.pp);put(r,'kp',t.kp);put(r,'tp',t.tp);
put(r,'el',t.kills);
var fc=String((data.flags||[])[t.id]||'');
var lg=String((data.logos||[])[t.id]||'');
img(r,'flag',/^[a-z]{2}(-[a-z]{2,3})?$/.test(fc)?'https://flagcdn.com/w80/'+fc+'.png':'');
img(r,'logo',lg.indexOf('data:image/')===0?lg:'');
if(r.cells.rank)r.cells.rank.className='c rank'+(rank<3?' m'+(rank+1):'');
var activeMatch=Number(data.currentMatch);
if(!isFinite(activeMatch)||activeMatch<0)activeMatch=(data.matches||[]).length-1;
var matchRows=(data.matches||[])[activeMatch]||{};
var isOut=!!(matchRows[t.id]&&matchRows[t.id].eliminated);
if(isOut)r.el.classList.add('eliminated');
else r.el.classList.remove('eliminated');
var tf='translateY('+(hh+rank*(rh+q.rs))+'px)';
if(r.tf!==tf){r.tf=tf;r.el.style.transform=tf;}
var op=rank<N?'1':'0';
if(r.op!==op){r.op=op;r.el.style.opacity=op;}
if(S.prev[t.id]!=null&&S.prev[t.id]!==rank){
S.moved.push(t.id);flash(r.el,rank<S.prev[t.id]);
}
S.prev[t.id]=rank;
});
Object.keys(S.rows).forEach(function(k){
if(!seen[k]){
S.rows[k].el.remove();
delete S.rows[k];delete S.prev[k];
}
});
if(S.first){
S.first=false;
requestAnimationFrame(function(){
requestAnimationFrame(function(){el.classList.remove('n');});
});
}
}
function clear(){rebuild();S.data=null;}
function setOpts(o){
Object.assign(S.o,o);rebuild();
if(S.data)update(S.data,S.view);
}
rebuild();
return{update:update,clear:clear,setOpts:setOpts,get moved(){return S.moved.slice();},get opts(){return S.o;}};
}
g.PSOverlay={mount:mount,compute:compute,COLS:COLS};
})(window);
</script>

<script>
(function(){
var p=new URLSearchParams(location.search);
if(p.get('mode')!=='overlay')return;

var token=p.get('t');
document.title='POINT FIX IT Live Overlay';

document.documentElement.style.cssText='margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important';
document.body.innerHTML='<div id="board" style="position:absolute;left:0;top:0"></div><div id="pfi-offline" style="color:white;background:#111;padding:8px;font:14px Arial">Connecting to organizer…</div>';
document.body.style.cssText='margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important';

if(!token){
document.body.innerHTML='<div style="color:white;background:#111;padding:12px;font:16px Arial">Overlay token is missing. Copy the complete URL from POINT FIX IT.</div>';
return;
}
if(!window.Peer){
document.getElementById('pfi-offline').textContent='PeerJS failed to load. Check your internet connection.';
return;
}

var board=document.getElementById('board');
var renderer=null,lastOpts='';
var peer=new Peer();
var conn=null;

function receive(msg){
if(!msg||msg.type!=='pfi-live'||!msg.payload||!msg.payload.data)return;
var payload=msg.payload;
var opts=payload.opts||{w:380,h:1080,fs:20,rs:6,ac:'#e10600',cols:['rank','team','mp','wwcd','pp','kp','tp']};

var css=document.getElementById('same-overlay-css');
if(!css){
css=document.createElement('style');
css.id='same-overlay-css';
css.textContent='@import url(https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap);html,body{background:transparent!important}';
document.head.appendChild(css);
}

var sig=JSON.stringify(opts);
if(!renderer){
renderer=window.PSOverlay.mount(board,opts);
lastOpts=sig;
}else if(lastOpts!==sig){
renderer.setOpts(opts);lastOpts=sig;
}
renderer.update(payload.data,payload.view==null?'o':payload.view);
var st=document.getElementById('pfi-offline');
if(st)st.remove();
}

peer.on('open',function(){
conn=peer.connect('pfi'+token,{reliable:true});
conn.on('open',function(){
var st=document.getElementById('pfi-offline');
if(st)st.textContent='Waiting for organizer…';
});
conn.on('data',receive);
conn.on('close',function(){
var st=document.getElementById('pfi-offline');
if(st)st.textContent='Organizer disconnected. Overlay link is offline.';
});
});

peer.on('error',function(e){
var st=document.getElementById('pfi-offline');
if(st)st.textContent='Cannot connect: '+(e.type||e.message||'offline');
});
})();
</script>

</body>
</html>
