<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRIME SCRIMS Live Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#root{position:relative;transform-origin:top left}
.err{font:14px Arial,sans-serif;color:#fff;background:#a00;padding:10px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
</head>
<body>
<div id="root"></div>

<!-- Standings renderer (unchanged logic) -->
<script>
(function(g){
var COLS=['rank','team','mp','wwcd','pp','kp','tp'];
var LB={rank:'#',team:'TEAM',mp:'MP',wwcd:'WWCD',pp:'PP',kp:'KP',tp:'TP'};
var CSS='.pso{position:relative;overflow:hidden;font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.95);line-height:1}'
+'.pso .r{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;box-sizing:border-box;padding:0 .4em 0 .3em;background:rgba(8,8,12,.66);border-left:.18em solid var(--ac);will-change:transform;transition:transform .8s cubic-bezier(.22,.8,.22,1),opacity .5s}'
+'.pso.n .r{transition:none}'
+'.pso .r.eliminated{background:linear-gradient(90deg,rgba(115,10,18,.96),rgba(42,7,12,.92));border-left-color:#ff2735;box-shadow:inset 0 0 0 1px rgba(255,39,53,.42)}'
+'.pso .r.eliminated .c.team{color:#ff747b;text-decoration:line-through;text-decoration-thickness:1px}'
+'.pso .r.h{background:var(--ac);border-left-color:transparent;font-weight:700;font-size:.55em;letter-spacing:.02em;text-shadow:none;color:var(--hc)}'
+'.pso .c{flex:none;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}'
+'.pso .c.rank{width:calc(var(--f)*1.6)}.pso .c.mp,.pso .c.wwcd,.pso .c.pp,.pso .c.kp{width:calc(var(--f)*2)}.pso .c.tp{width:calc(var(--f)*2.3);font-size:1.12em}.pso .r.h .c.tp{font-size:1em}'
+'.pso .c.team{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;padding:0 .3em}'
+'.pso .c.rank.m1,.pso .c.rank.m2,.pso .c.rank.m3{color:#1a1200;text-shadow:none;border-radius:.12em;margin-right:0}'
+'.pso .c.rank.m1{background:#f5c542}.pso .c.rank.m2{background:#cfd6df}.pso .c.rank.m3{background:#cd7f32}'
+'.pso .c.tp{color:#fff}';
function compute(d,view){
var kp=+d.kp||0,pts=d.pts||[],M=d.matches||[];
var pl=function(p){var n=parseInt(p,10);return n>0?(+pts[n-1]||0):0;};
var out=(d.teams||[]).map(function(n,i){
var m=0,w=0,pp=0,k=0;
if(view==null||view==='o'){
M.forEach(function(x){var r=x&&x[i];if(!r||(!r.p&&!r.k))return;m++;if(parseInt(r.p,10)===1)w++;k+=parseFloat(r.k)||0;pp+=pl(r.p);});
}else{
var r=(M[+view]||{})[i]||{};m=1;w=parseInt(r.p,10)===1?1:0;k=parseFloat(r.k)||0;pp=pl(r.p);
}
return{id:i,n:String(n),mp:m,wwcd:w,pp:pp,kills:k,kp:k*kp,tp:pp+k*kp};
});
out.sort(function(a,b){return b.tp-a.tp||b.wwcd-a.wwcd||b.kills-a.kills||a.id-b.id;});
return out;
}
function mount(el,o){
if(!document.getElementById('pso-css')){var s=document.createElement('style');s.id='pso-css';s.textContent=CSS;document.head.appendChild(s);}
var S={o:Object.assign({w:380,h:1080,fs:20,rs:6,ac:'#e10600',cols:COLS.slice(),n:25},o||{}),rows:{},prev:{},data:null,view:'o',first:true,moved:[]};
el.classList.add('pso','n');
function hc(a){var h=String(a).replace('#','');return(.299*parseInt(h.substr(0,2),16)+.587*parseInt(h.substr(2,2),16)+.114*parseInt(h.substr(4,2),16))>150?'#111':'#fff';}
function vis(){return COLS.filter(function(c){return S.o.cols.indexOf(c)>-1;});}
function cells(row,h){var c={};vis().forEach(function(k){var e=document.createElement('span');e.className='c '+k;if(h)e.textContent=LB[k];row.appendChild(e);c[k]=e;});return c;}
function rebuild(){
var q=S.o;el.textContent='';S.rows={};S.prev={};S.first=true;el.classList.add('n');
el.style.width=q.w+'px';el.style.height=q.h+'px';el.style.fontSize=q.fs+'px';
el.style.setProperty('--ac',q.ac);el.style.setProperty('--f',q.fs+'px');el.style.setProperty('--hc',hc(q.ac));
var h=document.createElement('div');h.className='r h';h.style.height=q.fs*1.4+'px';cells(h,true);el.appendChild(h);
}
function flash(e,up){try{e.animate([{boxShadow:'inset 0 0 0 999px '+(up?'rgba(70,255,140,.5)':'rgba(255,90,90,.45)')},{boxShadow:'inset 0 0 0 999px rgba(0,0,0,0)'}],{duration:1500,easing:'ease-out'});}catch(x){}}
function put(r,k,v){if(r.cells[k]&&r.v[k]!==v){r.v[k]=v;r.cells[k].textContent=v;}}
function update(data,view){
S.data=data;S.view=view==null?'o':String(view);S.moved=[];
var q=S.o,hh=q.fs*1.4,list=compute(data,S.view);
var N0=Math.max(1,Math.min(q.n,25,list.length));
var rh=Math.max(q.fs*1.25,Math.min(q.fs*1.9,(q.h-hh-(N0-1)*q.rs)/N0));
var fit=Math.max(0,Math.floor((q.h-hh+q.rs)/(rh+q.rs)));
var N=Math.min(N0,fit),seen={};
var activeMatch=Number(data.currentMatch);
if(!isFinite(activeMatch)||activeMatch<0){activeMatch=(data.matches||[]).length-1;}
var matchRows=(data.matches||[])[activeMatch]||{};
list.forEach(function(t,rank){
seen[t.id]=1;var r=S.rows[t.id];
if(!r){var e=document.createElement('div');e.className='r';r={el:e,cells:cells(e,false),v:{},tf:'',op:'',h:''};S.rows[t.id]=r;el.appendChild(e);}
if(r.h!==rh){r.h=rh;r.el.style.height=rh+'px';}
put(r,'rank',rank+1);put(r,'team',t.n);put(r,'mp',t.mp);put(r,'wwcd',t.wwcd);put(r,'pp',t.pp);put(r,'kp',t.kp);put(r,'tp',t.tp);
if(r.cells.rank){r.cells.rank.className='c rank'+(rank<3?' m'+(rank+1):'');}
var matchRow=matchRows[t.id];var isOut=!!(matchRow&&matchRow.eliminated);
r.el.classList.toggle('eliminated',isOut);
var tf='translateY('+(hh+rank*(rh+q.rs))+'px)';
if(r.tf!==tf){r.tf=tf;r.el.style.transform=tf;}
var op=rank<N?'1':'0';
if(r.op!==op){r.op=op;r.el.style.opacity=op;}
if(S.prev[t.id]!=null&&S.prev[t.id]!==rank){S.moved.push(t.id);flash(r.el,rank<S.prev[t.id]);}
S.prev[t.id]=rank;
});
Object.keys(S.rows).forEach(function(k){if(!seen[k]){S.rows[k].el.remove();delete S.rows[k];delete S.prev[k];}});
if(S.first){S.first=false;requestAnimationFrame(function(){requestAnimationFrame(function(){el.classList.remove('n');});});}
}
function clear(){rebuild();S.data=null;}
function setOpts(o){Object.assign(S.o,o);rebuild();if(S.data)update(S.data,S.view);}
rebuild();
return{update:update,clear:clear,setOpts:setOpts,get moved(){return S.moved.slice();},get opts(){return S.o;}};
}
g.PSOverlay={mount:mount,compute:compute,COLS:COLS};
})(window);
</script>

<!-- Elimination animation renderer -->
<script>
(function(g){
var CSS='.pel{position:relative;overflow:hidden;font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;color:#fff;pointer-events:none;line-height:1;text-shadow:0 .1em .3em rgba(0,0,0,.9)}'
+'.pel-bx{position:absolute;left:50%;bottom:11em;width:72em;margin-left:-36em;opacity:0;visibility:hidden}'
+'.pel-ln{height:.6em;background:linear-gradient(90deg,transparent,#ff2735 12%,#ff2735 88%,transparent);transform:scaleX(0);box-shadow:0 0 1.6em rgba(255,39,53,.9)}'
+'.pel-pn{display:flex;align-items:center;height:15em;margin:.8em 0;box-sizing:border-box;clip-path:inset(0 100% 0 0);background:linear-gradient(90deg,rgba(130,8,18,.97),rgba(16,6,10,.95) 60%,rgba(16,6,10,.9));border-left:.9em solid #ff2735}'
+'.pel-sk{flex:none;width:15em;height:100%;display:flex;align-items:center;justify-content:center;background:#ff2735;color:#fff}'
+'.pel-sk svg{width:9em;height:9em;transform:scale(0)}'
+'.pel-tx{flex:1;min-width:0;padding:0 3em}'
+'.pel-tg{font-size:3.4em;font-weight:700;letter-spacing:.35em;color:#ff5560}'
+'.pel-nm{font-size:7.5em;font-weight:700;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:.08em 0}'
+'.pel-mt{font-size:2.8em;font-weight:600;letter-spacing:.2em;color:#c9ccd3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}'
+'.pel-on{visibility:visible;opacity:1}'
+'.pel-on .pel-ln{animation:pelLn .5s ease-out forwards}'
+'.pel-on .pel-pn{animation:pelPn .55s .15s cubic-bezier(.2,.8,.2,1) forwards}'
+'.pel-on .pel-sk svg{animation:pelPop .5s .5s cubic-bezier(.3,1.6,.5,1) forwards,pelShake .5s 1s 2}'
+'.pel-on .pel-tg{animation:pelFl .6s .7s 1}'
+'.pel-on.pel-out{opacity:0;transform:translateY(2em);transition:opacity .5s,transform .5s}'
+'@keyframes pelLn{to{transform:scaleX(1)}}@keyframes pelPn{to{clip-path:inset(0 0 0 0)}}@keyframes pelPop{from{transform:scale(0)}to{transform:scale(1)}}'
+'@keyframes pelShake{0%,100%{transform:translate(0) scale(1)}25%{transform:translate(-.5em,.25em) scale(1)}50%{transform:translate(.5em,-.25em) scale(1)}75%{transform:translate(-.3em,-.2em) scale(1)}}'
+'@keyframes pelFl{0%,100%{opacity:1}15%,45%{opacity:.2}30%,60%{opacity:1}}';
var SKULL='<svg viewBox="0 0 64 64" fill="currentColor" aria-hidden="true"><path d="M32 6a22 22 0 0 0-22 22c0 7 3 12 8 16v10h28V44c5-4 8-9 8-16A22 22 0 0 0 32 6z"/><circle cx="23" cy="28" r="6" fill="#7a0710"/><circle cx="41" cy="28" r="6" fill="#7a0710"/><path d="M32 35l-4 8h8z" fill="#7a0710"/><path d="M26 47v7M32 47v7M38 47v7" stroke="#7a0710" stroke-width="2.4"/></svg>';
function mount(root){
if(!document.getElementById('pel-css')){var st=document.createElement('style');st.id='pel-css';st.textContent=CSS;document.head.appendChild(st);}
root.classList.add('pel');
root.innerHTML='<div class="pel-bx"><div class="pel-ln"></div><div class="pel-pn"><div class="pel-sk">'+SKULL+'</div><div class="pel-tx"><div class="pel-tg">ELIMINATED</div><div class="pel-nm"></div><div class="pel-mt"></div></div></div><div class="pel-ln"></div></div>';
var bx=root.querySelector('.pel-bx'),nm=root.querySelector('.pel-nm'),mt=root.querySelector('.pel-mt'),q=[],busy=false;
function fit(){root.style.fontSize=(root.clientWidth/100)+'px';}
function next(){
if(busy||!q.length)return;busy=true;var it=q.shift(),hold=q.length?2600:3900;
fit();nm.textContent=it.team;mt.textContent=it.meta;nm.style.fontSize='';
var fs=7.5;while(nm.scrollWidth>nm.clientWidth+1&&fs>3.2){fs-=.3;nm.style.fontSize=fs+'em';}
bx.className='pel-bx';void bx.offsetWidth;bx.className='pel-bx pel-on';
setTimeout(function(){bx.className='pel-bx pel-on pel-out';},hold);
setTimeout(function(){bx.className='pel-bx';busy=false;next();},hold+600);
}
return{show:function(team,meta){q.push({team:String(team==null?'':team),meta:meta||''});next();}};
}
g.PSElim={mount:mount};
})(window);
</script>

<script>
(function(){
const q=new URLSearchParams(location.search);
const token=q.get('t'),url=q.get('u'),key=q.get('k');
const isElim=q.get('mode')==='elim',demo=q.get('demo');
const root=document.getElementById('root');
function fail(m){root.innerHTML='<div class="err">'+m+'</div>';}

/* ---- Elimination mode (?mode=elim) ---- */
let elimMount=null;
if(isElim){
root.style.cssText='position:fixed;left:0;top:0;right:0;bottom:0';
elimMount=window.PSElim.mount(root);
if(demo){
const names=['Alpha Esports','Bravo Squad','Charlie Kings','Delta Force','Echo Wolves'];let n=0;
const d=function(){n++;elimMount.show(names[(n-1)%names.length],'MATCH 1 \u2022 '+n+(n===1?' TEAM OUT':' TEAMS OUT'));};
d();setInterval(d,7000);return;
}
}

if(!token||!url||!key){fail('Missing live ranking settings. Copy the full overlay URL from Point Table Maker.');return;}
if(!window.supabase){fail('Supabase library did not load. Check internet connection and reload.');return;}

const client=window.supabase.createClient(url,key,{auth:{persistSession:false,autoRefreshToken:false}});

async function fetchData(){
const {data,error}=await client.rpc('get_ptm_live_overlay',{p_token:token});
if(error)throw error;
if(!data||!data.data)throw new Error('No published ranking found for this URL. Publish again from the admin panel.');
return data;
}

if(isElim){
let prev=null,lastCur=null;
const feed=function(d){
const dd=d.data||{},M=dd.matches||[],T=dd.teams||[],list=[];
M.forEach(function(m,mi){Object.keys(m||{}).forEach(function(ti){if(m[ti]&&m[ti].eliminated)list.push({id:mi+':'+ti,mi:mi,team:T[+ti]||'Unknown Team'});});});
let cm=Number(dd.currentMatch!=null?dd.currentMatch:d.currentMatch);if(!isFinite(cm))cm=Math.max(0,M.length-1);
const now={};list.forEach(function(e){now[e.id]=1;});
if(prev===null||cm!==lastCur){prev=now;lastCur=cm;return;}
const fresh=list.filter(function(e){return !prev[e.id]&&e.mi===cm;});
const base=list.filter(function(e){return e.mi===cm&&prev[e.id];}).length;
prev=now;
fresh.forEach(function(e,i){const c=base+i+1;elimMount.show(e.team,'MATCH '+(cm+1)+' \u2022 '+c+(c===1?' TEAM OUT':' TEAMS OUT'));});
};
const poll=async function(){try{feed(await fetchData());}catch(e){console.warn('Elimination overlay sync error',e);}};
poll();setInterval(poll,1000);
return;
}

/* ---- Standings mode (default) ---- */
let mounted=null,last='',lastOpts='';
async function refresh(){
try{
const data=await fetchData();
const signature=JSON.stringify(data);
if(signature===last)return;
last=signature;
const o=data.opts||{};
const os=JSON.stringify(o);
if(!mounted){
mounted=window.PSOverlay.mount(root,Object.assign({w:380,h:1080,fs:20,rs:6,ac:'#e10600',cols:window.PSOverlay.COLS.slice()},o));
lastOpts=os;
}else if(os!==lastOpts){
mounted.setOpts(o);lastOpts=os;
}
mounted.update(data.data,data.view==null?'o':data.view);
document.documentElement.style.width=(o.w||380)+'px';
document.documentElement.style.height=(o.h||1080)+'px';
}catch(e){
if(!mounted)fail('Live ranking unavailable: '+String(e.message||e).replace(/[<>]/g,''));
console.error(e);
}
}
refresh();
setInterval(refresh,2000);
})();
</script>
</body>
</html>
