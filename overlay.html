/* PFILink: Supabase polling viewer (shared by the live ranking overlay and the elimination overlay).

(function(g){
var SBU='https://bubwhfqhqnxdesinbrrk.supabase.co',SBK='sb_publishable_ZPUvQim6gtObjRgg0fquWQ_WtV3fw4-';

    if(busy)return;busy=true;

      fails=0;
      if(!a.length){st('Waiting: organizer ne Publish nahi kiya');return;}
      if(a[0].updated_at===last){st('Live');return;}

        if(!b.length)return;
        last=b[0].updated_at;st('Live');

    .then(function(){busy=false;});
  }

  tick();timer=setInterval(tick,5000);
  g.addEventListener('online',tick);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)tick();});
  return{restart:function(){last='';tick();}};
}
