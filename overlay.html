 var prev=null,lastCur=null;
 function feed(pl){
  var list=Array.isArray(pl.eliminations)?pl.eliminations:[],cm=Number(pl.currentMatch);if(!isFinite(cm))cm=0;
  var now={};list.forEach(function(e){now[e.id]=1;});
  if(prev===null||cm!==lastCur){prev=now;lastCur=cm;return;}
  var fresh=list.filter(function(e){return !prev[e.id]&&e.matchIndex===cm;});
  var base=list.filter(function(e){return e.matchIndex===cm&&prev[e.id];}).length;
  prev=now;
  fresh.forEach(function(e,i){var c=base+i+1;m.show(e.team,'MATCH '+(cm+1)+' \u2022 '+c+(c===1?' TEAM OUT':' TEAMS OUT'));});
 }
 var prevW=null,lastW=null;
 function feedW(pl){var wl=Array.isArray(pl.wwcds)?pl.wwcds:[],cm=Number(pl.currentMatch);if(!isFinite(cm))cm=0;var now={};wl.forEach(function(e){now[e.id]=1;});
  if(prevW===null||cm!==lastW){prevW=now;lastW=cm;return;}
  var fresh=wl.filter(function(e){return !prevW[e.id]&&e.matchIndex===cm;});prevW=now;
  fresh.forEach(function(e){m.show(e.team,'MATCH '+(cm+1)+' \u2022 WINNER WINNER','wwcd');});}
 function feedAll(pl){var c=Number(pl.currentMatch);if(!isFinite(c))c=0;m.ctx(c,(pl.maps||[])[c]||'',pl.tournament||'');feed(pl);feedW(pl);}
 window.__elimFeed=feedAll;
 async function poll(){if(!window.supabase)return;try{
  if(!window.__ptmElimClient)window.__ptmElimClient=window.supabase.createClient(url,key,{auth:{persistSession:false,autoRefreshToken:false}});
  var res=await window.__ptmElimClient.rpc('get_ptm_live_overlay',{p_token:token});
  var pl=window.__ptmUnwrap(res.data);if(res.error||!pl||!pl.data)return;feedAll(pl);
 }catch(e){console.warn('Elimination overlay sync error',e);}}
 poll();setInterval(poll,1000);
})();
</script>
