function compute(d,view){

    else{var r=(M[+view]||{})[i]||{};m=1;w=parseInt(r.p,10)===1?1:0;k=parseFloat(r.k)||0;pp=pl(r.p);}
    return{id:i,n:String(n),mp:m,wwcd:w,pp:pp,kills:k,kp:k*kp,tp:pp+k*kp};});
  out.sort(function(a,b){return b.tp-a.tp||b.wwcd-a.wwcd||b.pp-a.pp||b.kills-a.kills||a.n.localeCompare(b.n);});
  return out;}
function mount(el,o){

  var S={o:Object.assign({w:380,h:1080,fs:20,rs:6,ac:'#e10600',cols:COLS.slice(),n:25},o||{}),rows:{},prev:{},data:null,view:'o',first:true,moved:[]};
  el.classList.add('pso','n');
  function hc(a){var h=String(a).replace('#','');return(.299*parseInt(h.substr(0,2),16)+.587*parseInt(h.substr(2,2),16)+.114*parseInt(h.substr(4,2),16))>150?'#111':'#fff';}
  function vis(){return COLS.filter(function(c){return S.o.cols.indexOf(c)>-1;});}
  function cells(row,h){var c={};vis().forEach(function(k){var e=document.createElement('span');e.className='c '+k;if(h)e.textContent=LB[k];row.appendChild(e);c[k]=e;});return c;}
  function rebuild(){var q=S.o;el.textContent='';S.rows={};S.prev={};S.first=true;el.className=(el.className.replace(/\s*\bd\d\b/g,'')+' d'+(q.dz||1)).trim();el.classList.add('n');
    el.style.width=q.w+'px';el.style.height=q.h+'px';el.style.fontSize=q.fs+'px';el.style.setProperty('--ac',q.ac);el.style.setProperty('--f',q.fs+'px');el.style.setProperty('--hc',hc(q.ac));
    var h=document.createElement('div');h.className='r h';h.style.height=q.fs*1.4+'px';cells(h,true);el.appendChild(h);}
  function flash(e,up){try{e.animate([{boxShadow:'inset 0 0 0 999px '+(up?'rgba(70,255,140,.5)':'rgba(255,90,90,.45)')},{boxShadow:'inset 0 0 0 999px rgba(0,0,0,0)'}],{duration:1500,easing:'ease-out'});}catch(x){}}
  function img(r,k,src){var c=r.cells[k];if(!c||r.v['i'+k]===src)return;r.v['i'+k]=src;c.textContent='';if(src){var m=new Image();m.alt='';m.src=src;c.appendChild(m);c.style.display='';}else c.style.display='none';}
  function put(r,k,v){if(r.cells[k]&&r.v[k]!==v){r.v[k]=v;r.cells[k].textContent=v;}}

    var q=S.o,hh=q.fs*1.4,list=compute(data,S.view),N0=Math.max(1,Math.min(q.n,25,list.length)),rh=Math.max(q.fs*1.25,Math.min(q.fs*1.9,(q.h-hh-(N0-1)*q.rs)/N0)),fit=Math.max(0,Math.floor((q.h-hh+q.rs)/(rh+q.rs))),N=Math.min(N0,fit),seen={};
    list.forEach(function(t,rank){seen[t.id]=1;var r=S.rows[t.id];
      if(!r){var e=document.createElement('div');e.className='r';r={el:e,cells:cells(e,false),v:{},tf:'',op:'',h:''};S.rows[t.id]=r;el.appendChild(e);}
      if(r.h!==rh){r.h=rh;r.el.style.height=rh+'px';}
      put(r,'rank',rank+1);put(r,'team',t.n);put(r,'mp',t.mp);put(r,'wwcd',t.wwcd);put(r,'pp',t.pp);put(r,'kp',t.kp);put(r,'tp',t.tp);put(r,'el',t.kills);var fc=String((data.flags||[])[t.id]||''),lg=String((data.logos||[])[t.id]||'');img(r,'flag',/^[a-z]{2}(-[a-z]{2,3})?$/.test(fc)?'https://flagcdn.com/w80/'+fc+'.png':'');img(r,'logo',lg.indexOf('data:image/')===0?lg:'');

      var activeMatch=Number(data.currentMatch);if(!isFinite(activeMatch)||activeMatch<0)activeMatch=(data.matches||[]).length-1;var matchRows=(data.matches||[])[activeMatch]||{};var isOut=!!(matchRows[t.id]&&matchRows[t.id].eliminated);if(isOut)r.el.classList.add('eliminated');else r.el.classList.remove('eliminated');

  }

<script>
(function(){
var params=new URLSearchParams(location.search);
if(params.get('mode')!=='overlay')return;
var token=params.get('t')||'';
var root=document.createElement('div');root.id='pfi-ranking-overlay';root.style.cssText='position:absolute;top:0;left:0;';document.body.appendChild(root);
var overlay=null,peer=null,conn=null,retryTimer=null,closed=false,lastPayload=null;
var defaults={w:380,h:1080,fs:20,rs:6,ac:'#e10600',dz:1,n:25};
function status(t){/* Connection status intentionally hidden from livestream. */}
function render(p){
 if(!p||!overlay)return;
 var d=p.data||p;
 if(!d||!Array.isArray(d.teams))return;
 lastPayload=p;
 var opts=Object.assign({},defaults,p.overlayOptions||p.options||{});
 overlay.setOpts(opts);
 overlay.update(d,p.view==null?'o':p.view);
}
function connect(){
 if(closed||!token||!window.Peer)return;
 try{
  if(peer){try{peer.destroy();}catch(e){}peer=null;conn=null;}
  peer=new Peer({debug:0});
  peer.on('open',function(){
   if(closed)return;
   status('');
   try{
    conn=peer.connect('pfi'+token,{reliable:true});
    conn.on('open',function(){status('');});
    conn.on('data',function(msg){
     if(msg&&msg.type==='pfi-live')render(msg.payload);
     else if(msg&&msg.data)render(msg);
    });
    conn.on('close',function(){status('');scheduleRetry();});
    conn.on('error',function(){status('');scheduleRetry();});
   }catch(e){scheduleRetry();}
  });
  peer.on('error',function(){status('');scheduleRetry();});
  peer.on('disconnected',function(){
   status('');
   try{if(peer&&!peer.destroyed)peer.reconnect();}catch(e){}
   scheduleRetry();
  });
  peer.on('close',function(){status('');scheduleRetry();});
 }catch(e){scheduleRetry();}
}
function scheduleRetry(){
 if(closed||retryTimer)return;
 retryTimer=setTimeout(function(){retryTimer=null;connect();},2000);
}
function start(){
 if(!token)return;
 overlay=window.PSOverlay.mount(root,defaults);
 connect();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);
else start();
window.addEventListener('beforeunload',function(){
 closed=true;
 if(retryTimer)clearTimeout(retryTimer);
 try{if(conn)conn.close();if(peer)peer.destroy();}catch(e){}
});
})();
</script>
<script>
(function(){
var params=new URLSearchParams(location.search);
if(params.get('mode')!=='elim')return;
var token=params.get('t')||'';
var box=document.createElement('div');
box.id='pfi-event-overlay';
box.style.cssText='position:absolute;inset:0;pointer-events:none;font-family:Arial,sans-serif;color:#fff;';
document.body.appendChild(box);
var peer=null,conn=null,retryTimer=null,closed=false,seenElims={},seenWwcd={},started=false;
var style=document.createElement('style');
style.textContent=
'#pfi-event-overlay .event-title{position:absolute;top:5%;left:50%;transform:translateX(-50%);min-width:38%;max-width:85%;padding:12px 28px;text-align:center;font-size:30px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:#fff;background:linear-gradient(90deg,rgba(15,15,18,.94),rgba(90,8,12,.94),rgba(15,15,18,.94));border-bottom:3px solid #e10600;text-shadow:0 2px 5px #000;box-shadow:0 5px 22px #0008;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}'
+'#pfi-event-overlay .event-card{position:absolute;left:50%;top:35%;transform:translate(-50%,-50%);min-width:42%;max-width:75%;padding:18px 28px;text-align:center;background:linear-gradient(120deg,rgba(12,12,16,.96),rgba(70,5,10,.96));border:2px solid #d91620;box-shadow:0 0 24px #e1060066;border-radius:8px;animation:pfiEventIn .35s ease-out}'
+'#pfi-event-overlay .event-kicker{font-size:18px;font-weight:900;letter-spacing:4px;color:#ff5a60}'
+'#pfi-event-overlay .event-name{font-size:42px;font-weight:900;letter-spacing:1px;margin-top:7px;text-shadow:0 3px 8px #000;overflow-wrap:anywhere}'
+'#pfi-event-overlay .event-sub{font-size:19px;font-weight:800;margin-top:8px;color:#ffd9d9}'
+'#pfi-event-overlay .event-card.wwcd{border-color:#e7bd47;background:linear-gradient(120deg,rgba(25,19,5,.96),rgba(83,54,5,.96))}'
+'#pfi-event-overlay .event-card.wwcd .event-kicker{color:#ffd95e}'
+'@keyframes pfiEventIn{from{opacity:0;transform:translate(-50%,-42%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}';

function title(name){
 var t=document.getElementById('pfi-event-title');
 if(!t){t=document.createElement('div');t.id='pfi-event-title';t.className='event-title';box.appendChild(t);}
 t.textContent=name||'TOURNAMENT';
}
function show(kind,name,sub){
 var old=document.getElementById('pfi-event-card');if(old)old.remove();
 var c=document.createElement('div');c.id='pfi-event-card';c.className='event-card'+(kind==='wwcd'?' wwcd':'');
 var k=document.createElement('div');k.className='event-kicker';k.textContent=kind==='wwcd'?'WINNER WINNER CHICKEN DINNER':'TEAM ELIMINATED';

 var s=document.createElement('div');s.className='event-sub';s.textContent=sub||'';
 c.appendChild(k);c.appendChild(n);if(sub){c.appendChild(s);}box.appendChild(c);
}
function getTeamName(p,id){
 var teams=p.teams||[];
 if(Array.isArray(teams))return String(teams[id]||('TEAM '+(Number(id)+1)));
 if(teams[id])return String(teams[id].name||teams[id].team||teams[id]);
 return 'TEAM '+(Number(id)+1);
}
function update(p){
 if(!p)return;
 var d=p.data||p;
 if(!d)return;
 var t=d.tournament||d.tournamentName||d.name||'TOURNAMENT';
 if(typeof t==='object')t=t.name||t.title||'TOURNAMENT';
 title(String(t));
 var match=Number(d.currentMatch);
 if(!isFinite(match))match=0;
 var maps=d.maps||[];
 var map=maps[match]||maps[match-1]||'';
 if(typeof map==='object')map=map.name||map.map||'';
 var elims=d.eliminations||[];
 if(!Array.isArray(elims))elims=[];
 var wwcds=d.wwcds||[];
 if(!Array.isArray(wwcds))wwcds=[];
 if(!started){elims.forEach(function(e){if(e&&e.id!=null)seenElims[String(e.id)]=1;});wwcds.forEach(function(w){if(w&&w.id!=null)seenWwcd[String(w.id)]=1;});started=true;return;}
 elims.forEach(function(e,i){
  if(!e)return;
  var id=String(e.id!=null?e.id:(match+'-'+i+'-'+(e.teamId!=null?e.teamId:e.team)));
  if(seenElims[id])return;seenElims[id]=1;
  var team=e.teamName||e.name||getTeamName(d,e.teamId!=null?e.teamId:e.team);
  show('elim',String(team),'MATCH '+(match+1)+(map?' • '+map:''));
 });
 wwcds.forEach(function(w,i){
  if(!w)return;
  var id=String(w.id!=null?w.id:(match+'-'+i+'-'+(w.teamId!=null?w.teamId:w.team)));
  if(seenWwcd[id])return;seenWwcd[id]=1;
  var team=w.teamName||w.name||getTeamName(d,w.teamId!=null?w.teamId:w.team);
  show('wwcd',String(team),'MATCH '+(match+1)+(map?' • '+map:''));
 });
}
function retry(){
 if(closed||retryTimer)return;
 retryTimer=setTimeout(function(){retryTimer=null;connect();},2000);
}
function connect(){
 if(closed||!token||!window.Peer)return;
 try{
  if(peer){try{peer.destroy();}catch(e){}peer=null;conn=null;}
  peer=new Peer({debug:0});
  peer.on('open',function(){
   if(closed)return;
   try{
    conn=peer.connect('pfi'+token,{reliable:true});
    conn.on('data',function(msg){
     if(msg&&msg.type==='pfi-live')update(msg.payload);
     else if(msg&&msg.data)update(msg);
    });
    conn.on('close',retry);
    conn.on('error',retry);
   }catch(e){retry();}
  });
  peer.on('disconnected',function(){
   try{if(peer&&!peer.destroyed)peer.reconnect();}catch(e){}
   retry();
  });
  peer.on('error',retry);
  peer.on('close',retry);
 }catch(e){retry();}
}
if(token){title('TOURNAMENT');connect();}
window.addEventListener('beforeunload',function(){
 closed=true;if(retryTimer)clearTimeout(retryTimer);
 try{if(conn)conn.close();if(peer)peer.destroy();}catch(e){}
});
})();
</script>
